name: Segnalazione di un problema
description: Descrivi un comportamento errato o un errore
labels: [bug]
body:
  - type: input
    id: versione
    attributes:
      label: Versione
      description: Versione del programma o hash del commit
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema operativo e ambiente
      description: Sistema operativo, versione del runtime o del browser, se rilevanti
    validations:
      required: true
  - type: textarea
    id: osservato
    attributes:
      label: Comportamento osservato
      description: Cosa succede di sbagliato
    validations:
      required: true
  - type: textarea
    id: atteso
    attributes:
      label: Comportamento atteso
      description: Cosa dovrebbe succedere
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: Passi per riprodurre
      placeholder: |
        1. Avvia ...
        2. Apri ...
        3. Nota ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log e output
      description: Output del comando o messaggi di errore. Togli token, chiavi e dati personali.
      render: shell
